# Feature repository config. Relative `path`s resolve against this directory.
# In Kubernetes a ConfigMap mounted at $SHALF_CONFIG replaces this file
# (see deploy/k8s), e.g. to switch the online store to Redis.
project: quickstart
definitions:
  - entities.py
  - features.py
offline_store:
  type: pandas
  # Every row computed by materialisation/backfills lands here (Parquet, per
  # view version); training and EDA read it instead of recomputing.
  cache_path: ${SHALF_OFFLINE_CACHE:-data/offline_cache}
online_store:
  type: sqlite
  path: ${SHALF_ONLINE_PATH:-data/online.db}

# SHALF_PROFILE=eda: notebooks / the EDA feature server. Never touches the
# source databases (cache only) and cannot write online values.
profiles:
  eda:
    offline_store:
      type: pandas
      cache_path: ${SHALF_OFFLINE_CACHE:-data/offline_cache}
      cache_only: true
    online_store:
      type: sqlite
      path: ${SHALF_ONLINE_PATH:-data/online.db}
      read_only: true
