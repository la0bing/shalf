[project]
name = "feature-server"
version = "0.1.0"
description = "Online feature serving API (Kubernetes Deployment)"
requires-python = ">=3.11"
dependencies = [
    "shalf-core",
    "shalf-data[redis,postgres]",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_server"]
