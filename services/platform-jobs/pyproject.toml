[project]
name = "platform-jobs"
version = "0.1.0"
description = "Batch image: dbt transforms + feature materialisation/backfills (CronJobs, Jobs)"
requires-python = ">=3.11"
dependencies = [
    "shalf-core",
    "shalf-data[postgres,redis]",
    "shalf-pipelines[dbt]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_jobs"]
