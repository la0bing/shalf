[project]
name = "inference-api"
version = "0.1.0"
description = "Model inference API (Kubernetes Deployment) - skeleton"
requires-python = ">=3.11"
dependencies = [
    "shalf-core",
    "shalf-data[redis,postgres]",
    "shalf-models",
    "shalf-serving",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_api"]
