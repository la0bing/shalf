[project]
name = "shalf-pipelines"
version = "0.1.0"
description = "shalf pipelines: scheduled/backfill runs of dbt transforms + feature materialisation"
requires-python = ">=3.11"
dependencies = [
    "shalf-core",
    "shalf-data",
]

[project.optional-dependencies]
dbt = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[project.scripts]
shalf-pipelines = "shalf.pipelines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shalf"]
