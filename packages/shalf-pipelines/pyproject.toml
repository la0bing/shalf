[project]
name = "shalf-pipelines"
version = "0.1.0"
description = "shalf pipelines: orchestrator-agnostic step/pipeline DAGs"
requires-python = ">=3.11"
dependencies = ["shalf-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shalf"]
