[project]
name = "shalf-core"
version = "0.1.0"
description = "shalf core: plugin registry, config loading, logging and shared errors"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shalf"]
