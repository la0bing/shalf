[project]
name = "shalf-monitoring"
version = "0.1.0"
description = "shalf monitoring: drift detection and model/data quality metrics"
requires-python = ">=3.11"
dependencies = ["shalf-core", "pandas>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shalf"]
