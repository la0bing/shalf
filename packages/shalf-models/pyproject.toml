[project]
name = "shalf-models"
version = "0.1.0"
description = "shalf models: model artifacts and the model registry abstraction"
requires-python = ">=3.11"
dependencies = ["shalf-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shalf"]
