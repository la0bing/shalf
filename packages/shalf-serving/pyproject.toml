[project]
name = "shalf-serving"
version = "0.1.0"
description = "shalf serving: predictor runtime shared by inference services"
requires-python = ">=3.11"
dependencies = ["shalf-core", "shalf-data", "shalf-models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shalf"]
