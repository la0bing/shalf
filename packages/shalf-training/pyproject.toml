[project]
name = "shalf-training"
version = "0.1.0"
description = "shalf training: datasets from feature services, trainers, experiment tracking"
requires-python = ">=3.11"
dependencies = ["shalf-core", "shalf-data", "shalf-models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shalf"]
