# Workspace root. Every deployable unit lives under packages/ (libraries) or
# services/ (things that become container images). `uv sync --all-packages`
# installs everything editable into one .venv for local development.
[project]
name = "shalf-monorepo"
version = "0.1.0"
description = "shalf: an extensible, end-to-end machine learning framework"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
shalf-core = { workspace = true }
shalf-data = { workspace = true }
shalf-training = { workspace = true }
shalf-models = { workspace = true }
shalf-serving = { workspace = true }
shalf-monitoring = { workspace = true }
shalf-pipelines = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "fakeredis[lua]>=2.20",
]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "examples"]
addopts = "--import-mode=importlib -q"
filterwarnings = [
    # Raised inside duckdb's DataFrame conversion (.df()), not by shalf code.
    "ignore:The inplace keyword in DataFrame.drop is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["shalf", "feature_server", "inference_api"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
