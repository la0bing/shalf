# Batch side of the data layer: computes features from the sources (ideally
# a read replica / warehouse, via SHALF_PG_DSN), writes every row to the
# offline cache and the latest values to the online store. Same image as the
# feature server, so both always run the same feature definitions.
#
# When a view's logic changed, the first run after the deploy builds the new
# version beside the old one and switches readers over at the end
# (auto_promote). For long histories run a backfill Job first: see
# deploy/k8s/jobs/backfill.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: feature-materializer
  labels:
    app.kubernetes.io/name: feature-materializer
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: feature-materializer
        spec:
          serviceAccountName: shalf
          priorityClassName: shalf-batch
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: materializer
              image: shalf-feature-server
              command: ["shalf-data", "materialize-incremental"]
              env:
                - name: SHALF_CONFIG
                  value: /etc/shalf/shalf.yaml
              envFrom:
                - configMapRef:
                    name: shalf-env
                - secretRef:
                    name: shalf-secrets
                    optional: true
              resources:
                requests: {cpu: 500m, memory: 1Gi}
                limits: {memory: 4Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: config
                  mountPath: /etc/shalf
                  readOnly: true
                - name: offline-cache
                  mountPath: /cache
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: shalf-feature-store-config
            - name: offline-cache
              persistentVolumeClaim:
                claimName: shalf-offline-cache
            - name: tmp
              emptyDir: {}
