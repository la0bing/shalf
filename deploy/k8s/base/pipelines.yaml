# Scheduled pipelines: `dbt build` for the pipeline's model selection, then
# materialisation of the feature views reading the rebuilt models. Runs on
# the project's jobs image, so dbt models and feature definitions are always
# the deployed versions. Pipeline names (hourly, daily) refer to the
# `pipelines:` section of the project's shalf.yaml; projects patch schedules
# or delete one they don't use.
#
# dbt-duckdb keeps one database file in /data/warehouse that only one writer
# can open: keep schedules from overlapping (concurrencyPolicy only prevents
# a CronJob from overlapping with itself).
#
# After a feature-logic change the first run builds the new version beside the
# old one and switches readers over at the end (auto_promote). For long
# histories run a backfill Job first (examples/quickstart/deploy/jobs/backfill.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-hourly
  labels:
    app.kubernetes.io/name: pipeline-hourly
    app.kubernetes.io/component: pipeline
spec:
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:  # lets the console list runs (scheduled and manual)
        app.kubernetes.io/component: pipeline
        shalf.io/pipeline: hourly
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/component: pipeline
        spec:
          serviceAccountName: shalf
          priorityClassName: shalf-batch
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pipeline
              image: shalf-project-jobs
              command: ["shalf-pipelines", "run", "hourly"]
              env:
                - name: SHALF_PROFILE
                  value: batch
              envFrom:
                - configMapRef:
                    name: shalf-env
                - secretRef:
                    name: shalf-secrets
                    optional: true
              resources:
                requests: {cpu: "1", memory: 2Gi}
                limits: {memory: 8Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: shalf-data
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-daily
  labels:
    app.kubernetes.io/name: pipeline-daily
    app.kubernetes.io/component: pipeline
spec:
  schedule: "37 2 * * *"  # between hourly runs
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:  # lets the console list runs (scheduled and manual)
        app.kubernetes.io/component: pipeline
        shalf.io/pipeline: daily
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1500
      template:
        metadata:
          labels:
            app.kubernetes.io/component: pipeline
        spec:
          serviceAccountName: shalf
          priorityClassName: shalf-batch
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pipeline
              image: shalf-project-jobs
              command: ["shalf-pipelines", "run", "daily"]
              env:
                - name: SHALF_PROFILE
                  value: batch
              envFrom:
                - configMapRef:
                    name: shalf-env
                - secretRef:
                    name: shalf-secrets
                    optional: true
              resources:
                requests: {cpu: "1", memory: 2Gi}
                limits: {memory: 8Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: shalf-data
            - name: tmp
              emptyDir: {}
