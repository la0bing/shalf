apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-server
  labels:
    app.kubernetes.io/name: feature-server
    app.kubernetes.io/component: online-feature-serving
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feature-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feature-server
    spec:
      serviceAccountName: shalf
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: feature-server
          image: shalf-feature-server
          command: ["uvicorn", "feature_server.app:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SHALF_CONFIG
              value: /etc/shalf/shalf.yaml
          envFrom:
            - configMapRef:
                name: shalf-env
            - secretRef:
                name: shalf-secrets
                optional: true
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/shalf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: shalf-feature-store-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: feature-server
spec:
  selector:
    app.kubernetes.io/name: feature-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: feature-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: feature-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: feature-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feature-server
