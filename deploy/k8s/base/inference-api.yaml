apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  labels:
    app.kubernetes.io/name: inference-api
    app.kubernetes.io/component: model-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-api
    spec:
      serviceAccountName: shalf
      priorityClassName: shalf-serving
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference-api
          image: shalf-inference-api
          command: ["uvicorn", "inference_api.app:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SHALF_CONFIG
              value: /etc/shalf/shalf.yaml
          envFrom:
            - configMapRef:
                name: shalf-env
            - secretRef:
                name: shalf-secrets
                optional: true
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/shalf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: shalf-feature-store-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inference-api
spec:
  selector:
    app.kubernetes.io/name: inference-api
  ports:
    - name: http
      port: 80
      targetPort: http
