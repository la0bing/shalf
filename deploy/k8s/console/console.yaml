apiVersion: v1
kind: ServiceAccount
metadata:
  name: shalf-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shalf-console
  labels:
    app.kubernetes.io/name: shalf-console
spec:
  replicas: 2  # stateless: sessions and RBAC live in the database
  selector:
    matchLabels:
      app.kubernetes.io/name: shalf-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shalf-console
    spec:
      serviceAccountName: shalf-console
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: shalf-console
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - secretRef:
                name: shalf-console-secrets
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          livenessProbe:
            httpGet: {path: /api/health, port: http}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/shalf-console
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /var/lib/shalf-console
      volumes:
        - name: config
          configMap:
            name: shalf-console-config
        - name: tmp
          emptyDir: {}
        - name: models  # until a model-registry plugin (MLflow, ...) is configured
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shalf-console
spec:
  selector:
    app.kubernetes.io/name: shalf-console
  ports:
    - name: http
      port: 80
      targetPort: http
